name: Release

# Push a tag like v0.2.0 (or v0.3.0-beta.1 for a pre-release) on main to publish.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  PKG: github.com/tshirtgang/tsg-embroidery-pro/internal/version

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=windows go vet ./...
      - run: go test -race -count=1 ./internal/... ./cmd/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && GOOS=windows govulncheck ./...
      - name: Release key is committed
        run: |
          if ! grep -qE '^[A-Za-z0-9+/]{43}=$' internal/updater/release-key.pub; then
            echo "::error::internal/updater/release-key.pub has no key - run 'go run ./cmd/releasekey gen'"
            exit 1
          fi

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, platform: windows/amd64, asset: tsg-embroidery-pro_windows_amd64.exe, out: tsg-embroidery-pro.exe }
          - { os: ubuntu-24.04, platform: windows/arm64, asset: tsg-embroidery-pro_windows_arm64.exe, out: tsg-embroidery-pro.exe }
          - { os: ubuntu-24.04, platform: linux/amd64, asset: tsg-embroidery-pro_linux_amd64, out: tsg-embroidery-pro, tags: webkit2_41 }
          - { os: macos-latest, platform: darwin/universal, asset: tsg-embroidery-pro_darwin_universal.zip, out: TSG Embroidery Pro.app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Stamp version into wails.json
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"; v="${v%%-*}"
          sed -i.bak "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$v\"/" wails.json && rm wails.json.bak
      - name: Build
        shell: bash
        run: |
          tags=""
          [ -n "${{ matrix.tags }}" ] && tags="-tags ${{ matrix.tags }}"
          wails build -platform "${{ matrix.platform }}" -clean -trimpath $tags \
            -ldflags "-s -w -X ${PKG}.Version=${GITHUB_REF_NAME} -X ${PKG}.Commit=${GITHUB_SHA} -X ${PKG}.Repo=${GITHUB_REPOSITORY}"
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            ditto -c -k --keepParent "build/bin/${{ matrix.out }}" "dist/${{ matrix.asset }}"
          else
            cp "build/bin/${{ matrix.out }}" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Create a "release" environment (Settings → Environments) holding the
    # UPDATE_SIGNING_KEY secret, optionally with required reviewers.
    environment: release
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tsg-embroidery-pro_* | tee checksums.txt
      - name: Sign checksums (Ed25519)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./cmd/releasekey sign dist/checksums.txt
          go run ./cmd/releasekey verify dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsg-embroidery-pro_*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "TSG Embroidery Pro $GITHUB_REF_NAME" --generate-notes --verify-tag $pre
