name: Release

# Every push to main publishes a new release, and the version goes up by one
# each time (0.1.0, 0.1.1, 0.1.2, ...). Pushes that only change docs are skipped.
# VERSION is the starting point: change it to 0.2.0 or 1.0.0 to jump to a new
# minor or major version, or to 0.3.0-beta.1 for a one-off pre-release.
# "Run workflow" on the Actions tab publishes the next version on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two quick pushes never pick the same number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PKG: github.com/phpandrew/TSG-Embroidery-Pro/internal/version

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick next version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$(tr -d ' \r\n' < VERSION)"
          base="${base#v}"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::VERSION must look like 1.2.3 or 1.2.3-beta.1 (got '$base')"; exit 1
          fi
          released="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName -q '.[].tagName' || true)"
          has() { grep -qxF "v$1" <<<"$released"; }
          if [[ "$base" == *-* ]]; then
            # pre-release: publish exactly what VERSION says, once
            if has "$base"; then
              echo "::notice::v$base is already released; change VERSION to publish another pre-release"
              echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            ver="$base"
          else
            # highest stable release so far, or none
            latest="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$released" | sed 's/^v//' | sort -V | tail -1 || true)"
            if [[ -z "$latest" ]] || [[ "$(printf '%s\n%s\n' "$latest" "$base" | sort -V | tail -1)" == "$base" && "$base" != "$latest" ]]; then
              ver="$base"   # VERSION is ahead of every release: start there
            else
              IFS=. read -r ma mi pa <<<"$latest"
              ver="$ma.$mi.$((pa + 1))"
            fi
          fi
          echo "Releasing v$ver"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only release from main
        run: test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: GOOS=windows go vet ./...
      - run: go test -race -count=1 ./internal/... ./cmd/...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && GOOS=windows govulncheck ./...
      - name: Release key is committed
        run: |
          if ! grep -qE '^[A-Za-z0-9+/]{43}=$' internal/updater/release-key.pub; then
            echo "::error::internal/updater/release-key.pub has no key - run 'go run ./cmd/releasekey gen'"
            exit 1
          fi

  build:
    needs: [prepare, test]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, platform: windows/amd64, asset: tsg-embroidery-pro_windows_amd64.exe, out: tsg-embroidery-pro.exe }
          - { os: ubuntu-24.04, platform: windows/arm64, asset: tsg-embroidery-pro_windows_arm64.exe, out: tsg-embroidery-pro.exe }
          - { os: ubuntu-24.04, platform: linux/amd64, asset: tsg-embroidery-pro_linux_amd64, out: tsg-embroidery-pro, tags: webkit2_41 }
          - { os: macos-latest, platform: darwin/universal, asset: tsg-embroidery-pro_darwin_universal.zip, out: TSG Embroidery Pro.app }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Stamp version into wails.json
        shell: bash
        run: |
          v="${TAG#v}"; v="${v%%-*}"
          sed -i.bak "s/\"productVersion\": \"[^\"]*\"/\"productVersion\": \"$v\"/" wails.json && rm wails.json.bak
      - name: Build
        shell: bash
        run: |
          tags=""
          [ -n "${{ matrix.tags }}" ] && tags="-tags ${{ matrix.tags }}"
          wails build -platform "${{ matrix.platform }}" -clean -trimpath $tags \
            -ldflags "-s -w -X ${PKG}.Version=${TAG} -X ${PKG}.Commit=${GITHUB_SHA} -X ${PKG}.Repo=${GITHUB_REPOSITORY}"
          mkdir -p dist
          if [[ "${{ matrix.platform }}" == darwin/* ]]; then
            ditto -c -k --keepParent "build/bin/${{ matrix.out }}" "dist/${{ matrix.asset }}"
          else
            cp "build/bin/${{ matrix.out }}" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-24.04
    # Create a "release" environment (Settings → Environments) holding the
    # UPDATE_SIGNING_KEY secret, optionally with required reviewers.
    environment: release
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum tsg-embroidery-pro_* | tee checksums.txt
      - name: Sign checksums (Ed25519)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          go run ./cmd/releasekey sign dist/checksums.txt
          go run ./cmd/releasekey verify dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/tsg-embroidery-pro_*
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [[ "$TAG" == *-* ]] && pre="--prerelease"
          # creates the tag on this commit
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TSG Embroidery Pro $TAG" --generate-notes $pre
