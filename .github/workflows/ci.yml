name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Run gofmt on:"; echo "$out"; exit 1; fi
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum
      # The desktop shell needs cgo/WebKit on Linux, so type-check for Windows.
      - name: go vet
        run: GOOS=windows go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          GOOS=windows staticcheck ./...
      - name: unit tests
        run: go test -race -count=1 ./internal/... ./cmd/...
      - name: fuzz DST reader (30s)
        run: go test ./internal/dst -run='^$' -fuzz=FuzzRead -fuzztime=30s

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan (Windows build)
        run: GOOS=windows govulncheck ./...
      - name: Scan (shared packages)
        run: govulncheck ./internal/... ./cmd/...

  build:
    name: Build Windows exe
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build
        run: |
          wails build -platform windows/amd64 -clean -trimpath \
            -ldflags "-X github.com/phpandrew/TSG-Embroidery-Pro/internal/version.Commit=${GITHUB_SHA}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsg-embroidery-pro-windows-${{ github.sha }}
          path: build/bin/tsg-embroidery-pro.exe
          retention-days: 14
